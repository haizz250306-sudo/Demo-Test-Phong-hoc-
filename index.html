<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Phòng Học Smart Campus</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans text-slate-800">

  <!-- Header -->
  <header class="max-w-md mx-auto mb-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
    <h1 class="text-xl font-bold text-slate-900">Trạng Thái Phòng Học</h1>
    <p class="text-xs text-slate-500 mt-1">Giờ hiện tại: <span id="current-time" class="font-semibold text-blue-600">--:--</span></p>
  </header>

  <!-- Room List -->
  <main class="max-w-md mx-auto space-y-3" id="room-list">
    <!-- Render từ JS -->
  </main>

  <!-- Modal Mượn Phòng Tạm Thời -->
  <div id="booking-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
      <h3 class="font-bold text-lg text-slate-900" id="modal-room-name">Mượn phòng</h3>
      
      <div id="modal-info" class="text-sm text-slate-600 bg-amber-50 p-3 rounded-lg border border-amber-200">
        <!-- Thông tin lớp học tiếp theo -->
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-2">CHỌN THỜI GIAN MƯỢN</label>
        <div class="grid grid-cols-3 gap-2" id="time-options">
          <!-- Các option thời gian sẽ render tự động ở đây -->
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-slate-100 font-semibold text-slate-600 text-sm">Hủy</button>
        <button onclick="confirmBooking()" class="flex-1 py-2 rounded-xl bg-blue-600 font-semibold text-white text-sm hover:bg-blue-700">Xác nhận mượn</button>
      </div>
    </div>
  </div>

  <script>
    // Dữ liệu giả lập phòng học & lịch
    let rooms = [
      { id: 'A201', status: 'FREE', nextClass: '09:30', nextSubject: 'Triết học Mác - Lênin', bookedUntil: null },
      { id: 'A202', status: 'BUSY', currentSubject: 'Xác suất Thống kê', freeAt: '10:15', nextClass: null },
      { id: 'A203', status: 'FREE', nextClass: '11:00', nextSubject: 'Tư tưởng Hồ Chí Minh', bookedUntil: null },
      { id: 'B101', status: 'FREE', nextClass: '08:45', nextSubject: 'Lập trình Web', bookedUntil: null },
    ];

    let selectedRoomId = null;

    // Giả lập giờ hiện tại là 08:00
    const CURRENT_HOUR = 8;
    const CURRENT_MIN = 0;
    document.getElementById('current-time').innerText = '08:00 AM';

    function renderRooms() {
      const container = document.getElementById('room-list');
      container.innerHTML = '';

      rooms.forEach(room => {
        let cardHtml = '';
        
        if (room.status === 'BUSY') {
          cardHtml = `
            <div class="bg-white p-4 rounded-xl border border-red-200 shadow-sm flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-red-500"></span>
                  <span class="font-bold text-lg">${room.id}</span>
                  <span class="text-xs px-2 py-0.5 bg-red-100 text-red-700 font-semibold rounded-full">Đang học</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">Môn: ${room.currentSubject}</p>
                <p class="text-xs text-slate-400">Trống lại lúc: <span class="font-semibold text-slate-700">${room.freeAt}</span></p>
              </div>
            </div>`;
        } 
        else if (room.status === 'BOOKED') {
          cardHtml = `
            <div class="bg-white p-4 rounded-xl border border-amber-200 shadow-sm flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                  <span class="font-bold text-lg">${room.id}</span>
                  <span class="text-xs px-2 py-0.5 bg-amber-100 text-amber-700 font-semibold rounded-full">Đang có người mượn</span>
                </div>
                <p class="text-xs text-slate-500 mt-1">Mượn tự do đến: <span class="font-bold text-amber-600">${room.bookedUntil}</span></p>
                <p class="text-xs text-slate-400">Lớp tiếp theo: ${room.nextClass} (${room.nextSubject})</p>
              </div>
            </div>`;
        }
        else {
          cardHtml = `
            <div class="bg-white p-4 rounded-xl border border-emerald-200 shadow-sm flex justify-between items-center">
              <div>
                <div class="flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                  <span class="font-bold text-lg">${room.id}</span>
                  <span class="text-xs px-2 py-0.5 bg-emerald-100 text-emerald-700 font-semibold rounded-full">Đang trống</span>
                </div>
                <p class="text-xs text-slate-600 mt-1">
                  Lớp tiếp theo: <span class="font-bold text-slate-800">${room.nextClass}</span> (${room.nextSubject})
                </p>
              </div>
              <button onclick="openBookingModal('${room.id}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 text-xs font-bold rounded-lg hover:bg-blue-100 border border-blue-200">
                Mượn ngay
              </button>
            </div>`;
        }

        container.innerHTML += cardHtml;
      });
    }

    function openBookingModal(roomId) {
      selectedRoomId = roomId;
      const room = rooms.find(r => r.id === roomId);
      
      document.getElementById('modal-room-name').innerText = `Mượn phòng ${room.id}`;
      document.getElementById('modal-info').innerHTML = `
        ⏳ Lớp học tiếp theo: <b>${room.nextClass}</b> (${room.nextSubject}).<br/>
        <i>Hệ thống tự động chặn các mốc thời gian làm lấn vào lịch học chính.</i>
      `;

      // Tính phút còn trống từ 08:00 đến nextClass
      const [nextH, nextM] = room.nextClass.split(':').map(Number);
      const totalAvailableMinutes = (nextH * 60 + nextM) - (CURRENT_HOUR * 60 + CURRENT_MIN) - 15; // Trừ 15p buffer

      const timeOptionsContainer = document.getElementById('time-options');
      timeOptionsContainer.innerHTML = '';

      const options = [
        { label: '30 phút', mins: 30 },
        { label: '45 phút', mins: 45 },
        { label: '60 phút', mins: 60 },
        { label: '90 phút', mins: 90 },
      ];

      options.forEach((opt, index) => {
        const isAllowed = opt.mins <= totalAvailableMinutes;
        const btnClass = isAllowed 
          ? 'border-slate-200 bg-slate-50 hover:bg-blue-50 hover:border-blue-500 text-slate-700 cursor-pointer' 
          : 'border-slate-100 bg-slate-100 text-slate-300 cursor-not-allowed line-through';

        timeOptionsContainer.innerHTML += `
          <button 
            ${!isAllowed ? 'disabled' : ''} 
            onclick="selectTime(this, ${opt.mins})"
            class="time-btn border p-2 text-xs font-semibold rounded-lg text-center transition-all ${btnClass}">
            ${opt.label}
          </button>
        `;
      });

      document.getElementById('booking-modal').classList.remove('hidden');
      document.getElementById('booking-modal').classList.add('flex');
    }

    let selectedMins = 0;
    function selectTime(btn, mins) {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-600'));
      btn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-600');
      selectedMins = mins;
    }

    function confirmBooking() {
      if (!selectedMins) {
        alert('Vui lòng chọn thời gian mượn!');
        return;
      }
      
      const room = rooms.find(r => r.id === selectedRoomId);
      room.status = 'BOOKED';
      
      // Tính giờ trả phòng
      const endMins = CURRENT_HOUR * 60 + CURRENT_MIN + selectedMins;
      const endH = Math.floor(endMins / 60).toString().padStart(2, '0');
      const endM = (endMins % 60).toString().padStart(2, '0');
      
      room.bookedUntil = `${endH}:${endM}`;

      closeModal();
      renderRooms();
    }

    function closeModal() {
      selectedMins = 0;
      document.getElementById('booking-modal').classList.add('hidden');
      document.getElementById('booking-modal').classList.remove('flex');
    }

    // Initial render
    renderRooms();
  </script>
</body>
</html>
